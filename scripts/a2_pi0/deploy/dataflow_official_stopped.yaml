# Integration check with the official nodes held in STOPPED state.
# No command input is wired. This graph cannot start either arm.
# Camera frames are recorded fixtures from mock_openarm_node.py.
nodes:
  - id: policy
    path: dora_policy_node.py
    inputs:
      tick: dora/timer/millis/5
      camera_global: replay/camera_global
      camera_chest: replay/camera_chest
      camera_wrist_left: replay/camera_wrist_left
      camera_wrist_right: replay/camera_wrist_right
      state_right: right/state
      state_left: left/state
      status_right: right/status
      status_left: left/status
    outputs: [request_right, request_left, target_right, target_left]

  - id: right
    path: ../../../.cache/openarm-policy-driver/bin/dora-openarm
    args: --side right --config openarm_pedestal
    inputs:
      request_state: policy/request_right
      move_position: policy/target_right
    outputs: [state, status]

  - id: left
    path: ../../../.cache/openarm-policy-driver/bin/dora-openarm
    args: --side left --config openarm_pedestal
    inputs:
      request_state: policy/request_left
      move_position: policy/target_left
    outputs: [state, status]

  - id: replay
    path: mock_openarm_node.py
    inputs:
      camera_tick: dora/timer/millis/33
    outputs: [camera_global, camera_chest, camera_wrist_left, camera_wrist_right, status_right, status_left]
