# 历史接线草稿，当前入口见同目录 README.md。相机载荷、代次和停机逻辑须重新核对。
# 策略接入补丁（片段，不是可直接 dora run 的完整图）
#
# 目标：把 policy_client_node 的 position_left/right 与 leader 的 IK 目标
# 经 position-mux 二选一后送到 robot 的 move_position，其余链路保持不变。
#
# 落地位置（机械臂电脑）：在 openarm_diffusion_policy/vr_teleoperation/local/
# 的真实四路图里改；注意 four_camera/launch.py 会读
# dataflow_webxr_real_three_camera.yaml 再就地改写 ui/recorder 的相机输入，
# 因此 policy 节点的相机输入必须写成 cameras/status_*，不能用 robot/camera_*。
#
#   cp policy_client_node.py position_mux_node.py  ->  /home/pan/openarm_diffusion_policy/deploy/
#   mkdir -p /media/pan/Expansion1/openarm_policy_logs
#   echo leader > /media/pan/Expansion1/openarm_policy_logs/policy_mode.txt
#
# 模式切换（人工，随时可回）：
#   echo policy > /media/pan/Expansion1/openarm_policy_logs/policy_mode.txt
#   echo leader > /media/pan/Expansion1/openarm_policy_logs/policy_mode.txt

nodes:
  # 1) 策略客户端：30 Hz 出目标，只写 policy/position_*，不碰任何 command
  - id: policy
    path: /home/pan/openarm_diffusion_policy/vr_teleoperation/upstream/dora-openarm-data-collection/.venv/bin/python
    args: >-
      /home/pan/openarm_diffusion_policy/deploy/policy_client_node.py
      --server-host 192.168.1.10 --server-port 5555
      --hz 30 --chunk-exec 20
      --log /media/pan/Expansion1/openarm_policy_logs/policy.jsonl
    env:
      # 真正发布必须显式授权；缺这一行时节点自动降级为 shadow
      OPENARM_POLICY_PUBLISH: "1"
    inputs:
      tick: quittable-tick-policy/tick
      camera_global: cameras/status_global
      camera_chest: cameras/status_chest
      camera_wrist_left: cameras/status_wrist_left
      camera_wrist_right: cameras/status_wrist_right
      state_left: robot/state_left
      state_right: robot/state_right
    outputs:
      - position_left
      - position_right

  # 2) 33 ms 节拍器，跟随 ui 退出
  - id: quittable-tick-policy
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      tick: dora/timer/millis/33
    outputs:
      - tick

  # 3) 位置复用器：默认转发 leader，只有模式文件写 policy 且目标足够接近才切
  - id: position-mux
    path: /home/pan/openarm_diffusion_policy/vr_teleoperation/upstream/dora-openarm-data-collection/.venv/bin/python
    args: >-
      /home/pan/openarm_diffusion_policy/deploy/position_mux_node.py
      --coerce --stale-ms 300 --switch-tolerance 0.05
      --mode-file /media/pan/Expansion1/openarm_policy_logs/policy_mode.txt
    inputs:
      tick: dora/timer/millis/200
      leader_left: leader/follower_position_left
      leader_right: leader/follower_position_right
      policy_left: policy/position_left
      policy_right: policy/position_right
      arm_command: arm-command-mux/arm_command
    outputs:
      - position_left
      - position_right

  # 4) robot 节点只改这两行：move_position 改由 mux 提供
  - id: robot
    module: robot_real_pedestal.yaml
    inputs:
      tick: quittable-tick-leader/tick
      camera_tick: quittable-tick-camera/tick
      command: ui/command
      arm_command: arm-command-mux/arm_command
      position_right: position-mux/position_right   # 原来是 leader/follower_position_right
      position_left: position-mux/position_left     # 原来是 leader/follower_position_left
      joystick_y: leader/joystick_y_left
      button_x: leader/button_x
      pose_right: leader/pose_right
      pose_left: leader/pose_left
